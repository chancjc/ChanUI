.lamp-detail-dialog.case-detail-dialog[open] {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  width: min(940px, calc(100vw - 28px));
  max-width: none;
  max-height: calc(100dvh - 28px);
  overflow: hidden;
}
.case-detail-dialog .dialog-hd {
  position: static;
  padding: 12px 20px;
}
.case-detail-dialog .dialog-hd h2 {
  font-size: 18px;
}
.case-detail-dialog .lamp-detail-content {
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  padding: 16px 20px;
}
.case-detail-overview {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
  align-items: start;
}
.case-detail-media {
  min-width: 0;
}
.case-detail-media .detail-photo,
.case-detail-media .no-image {
  width: 100%;
  height: auto;
  max-height: min(46dvh, 300px);
  aspect-ratio: 8 / 5;
  object-fit: contain;
  background: #f3efe8;
  border: 1px solid var(--edge);
  border-radius: 8px;
}
.case-detail-image-frame {
  position: relative;
}
.case-detail-image-count {
  position: absolute;
  right: 6px;
  bottom: 6px;
  padding: 2px 7px;
  border-radius: 999px;
  background: #332a22db;
  color: #fff;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
.case-detail-thumbnails {
  display: flex;
  gap: 4px;
  margin-top: 6px;
}
.case-detail-thumbnails button {
  flex: 0 1 54px;
  min-width: 0;
  height: 42px;
  padding: 2px;
  border-radius: 6px;
}
.case-detail-thumbnails button[aria-pressed="true"] {
  border-color: var(--accent);
  background: var(--accent-bg);
  box-shadow: inset 0 0 0 1px var(--accent);
}

  display: block;
  width: 100%;
  height: 100%;
  border-radius: 3px;
  object-fit: contain;
  background: var(--soft);
}

  min-width: 0;
  overflow-wrap: anywhere;
}
.case-detail-info .lamp-origin {
  margin: 0 0 10px;
}

  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0 12px;
  margin: 0;
  padding: 2px 10px;
  border: 1px solid var(--edge);
  border-radius: 8px;
  background: #fbfaf7;
}
.case-detail-info .product-facts div {
  display: block;
  min-width: 0;
  padding: 6px 0;
  line-height: 1.35;

  margin-top: 8px;

  padding: 9px 20px;

function trimFindHistory(){

    if(sessions.length<=FIND_HISTORY_LIMIT&&sessions.every(entry=>entry.messages.length||entry.id===finding.active[role]))continue;

function makeDraft(text,cid,pid,channel,contact=''){
  const normalized=[...new Set(text.replace(/\r/g,'').split('\n').map(line=>line.trim()).filter(Boolean))].join('\n');
  const clientLines=normalized.split('\n').filter(line=>!/^\s*(?:我方|我|销售|Wendy|王敏)\s*[:：]/i.test(line));
  const evidence=clientLines.join('\n')||normalized;
  const clues=[
    ['场景',/(?:迪拜酒店大堂|酒店中庭|酒店大堂|大堂|客厅|餐厅|走廊|展厅|卧室|别墅)/],
    ['灯型',/(?:轨道射灯|吊灯|壁灯|筒灯|吸顶灯|台灯|落地灯|灯带)/],
    ['工艺',/(?:黄铜拉丝|拉丝黄铜|黄铜|玻璃|亚克力|铝合金|磨砂|喷砂)/],
    ['风格',/(?:中式|现代简约|意式|法式|美式|复古|工业风|中古风|侘寂风|北欧)/],
    ['形状',/(?:环形|长条形|球形|圆形|方形|飞碟形|线性)/],
    ['颜色',/(?:偏铜色|哑黑|纯白|乳白|枪灰|香槟金|琥珀色)/],
    ['数量',/\d+\s*(?:盏|套|件|只)/],
    ['预算',/(?:每盏|每套|每件)?\s*(?:预算(?:每盏|每套|每件)?\s*)?(?:(?:¥|￥|USD|RMB|CNY|\$)\s*\d[\d,.]*|(?:\d[\d,.]*\s*(?:元|美元)))/i],
    ['光色',/(?:\d{4}\s*K|暖光|中性光|冷光)/i],
    ['尺寸',/(?:直径|长|宽|高|尺寸)\s*(?:改成|改为|换成|调整为)?\s*(?:约|大约)?\s*\d+(?:\.\d+)?\s*(?:mm|cm|毫米|厘米|米)/i],
    ['报价时间',/(?:下周[一二三四五六日天]|本周[一二三四五六日天]|明天|后天|\d{1,2}月\d{1,2}日)(?:前|内)?/]
  ];
  const needs=clues.flatMap(([label,pattern])=>{
    const value=evidence.match(pattern)?.[0]?.trim();
    return value?[{label,value}]:[];
  });
  if(/不要亮金|不接受亮金/.test(evidence)){
    const finish=needs.find(entry=>entry.label==='工艺');
    if(finish)finish.value+='，避开亮金';
    else needs.push({label:'偏好',value:'避开亮金'});
  }
  const inferredName=evidence.match(/(?:客户|联系人)[\s：:]*(?:小红书\s*)?([A-Z][A-Za-z .'-]{1,25})(?=[：:\n]|$)/m)?.[1]?.trim()||'';
  const detail=needs.filter(item=>['场景','灯型','工艺','光色','尺寸'].includes(item.label)).map(item=>item.value);
  const greeting=contact||inferredName;
  const reply=detail.length?`${greeting?greeting+'，您好。':'您好。'}收到，先按${detail.join('、')}筛选合适的款式。等方案确认后，我会把规格和报价时间一起跟您确认。`:
    `${greeting?greeting+'，您好。':'您好。'}收到您的消息。方便补充使用场景、喜欢的灯具款式或参考图吗？我整理后给您推荐。`;
  return {id:id(),text:normalized,customerId:cid,projectId:pid,channel,contact:greeting,needs,reply};
}
function getRoute(text,hasFiles,pending,selected){
  if(selected&&selected!=='quote')return selected;
  if(/(?:^|\n)\s*(?:(?:微信|小红书)\s*)?(?:客户|我方|我|销售)(?:\s+[^：:\n]{1,16})?\s*[：:]/.test(text))return 'customer';
  if(/(?:录入|新增|补录|添加).{0,8}(?:企业案例|案例库|灯具案例)/.test(text))return 'case';
  if(/(?:权限|谁能看|客户档案)/.test(text))return 'permission';
  if(/(?:待跟进|跟进列表|今日跟进|到期任务|逾期任务)/.test(text))return 'pending';
  if(/(?:记个跟进|写跟进|写一条跟进|记录.{0,5}跟进|保存.{0,5}跟进|刚.{0,8}打了电话|沟通纪要)/.test(text))return 'record';
  if(/(?:组件报价|组件解析与报价|报价核价|解析.{0,5}组件|拆解.{0,5}灯具|估(?:一下|算)?成本|核价)/.test(text))return 'quote';
  if(/(?:整理|提炼|导入|登记).{0,12}(?:客户|对话|聊天|需求)|(?:建议回复|怎么回复|回复话术|客户说|小红书)|(?:^|\n)\s*(?:客户|Omar|Sara|Lina).{0,22}[：:]/m.test(text))return 'customer';
  if(/(?:找灯|选型|选灯|找相似|重新找|找.{0,12}(?:射灯|吊灯|壁灯|筒灯|灯具)|参考.{0,5}图)/.test(text))return 'lights';
  if(pending)return pending;
  if(text.includes('\n')&&/[：:]/.test(text))return 'customer';
  return hasFiles?'customer':'help';
}

      const draft=makeDraft(evidence,session.customerId,session.projectId,channel,customer(session.customerId)?.contact);
      session.pending='';
      runJob(session,'customer',{kind:'proposal',tool:'客户跟进',text:'已提炼 '+draft.needs.length+' 项需求。核对后可以登记客户、拟回复或继续找灯。',draft});

    session.pending='';
  }else if(route==='lights'){
    const last=latestSelection(session).result;
    const fresh=/换个方向|清空条件|换一种灯/.test(clean);
    const existing=fresh?[]:(last?.needs||customer(session.customerId)?.needs||[]);
    const draft=makeDraft(clean,session.customerId,session.projectId,'当前对话');
    const remove='(?:移除|忽略|删除|删掉|去掉|不限制|不限)';
    const removed=existing.filter(([key])=>new RegExp(remove+'[^，。；]{0,5}'+key+'|'+key+'[^，。；]{0,5}'+remove).test(clean)).map(([key])=>key);
    const next=lightConditionMap([...existing,...draft.needs.map(item=>[item.label,item.value])]).filter(([key])=>!removed.includes(key));
    addLampMessage(session,next,{tab:last?.tab,projectId:last?.projectId??session.projectId,customerId:last?.customerId??session.customerId,
      summary:removed.length?'已移除'+removed.join('、')+'，沿用其他条件。':''});
  }else if(route==='pending'){
    session.pending='';
    session.messages.push({kind:'input',tool:'客户跟进',text:`你有 ${db.follow.filter(item=>!item.done&&item.due<=today).length} 条已到期的跟进任务。`,action:'open-follow'});
  }else if(route==='record'){

    session.messages.push({kind:'follow',tool:'客户跟进',text:'可以保存为一条跟进。请核对客户、项目、结论和下次跟进日期。',
      draft:{summary:clean.replace(/^(?:帮我)?(?:记个跟进|写一条跟进|写跟进)[：:，,\s]*/,''),customerId:session.customerId,projectId:session.projectId,channel:/邮件/.test(clean)?'邮件':/微信/.test(clean)?'微信':'电话'}});

  }else{

  }

  persist();render(true);
}

const matchState={yes:'符合',no:'不符合',unknown:'待核实'};
const lampSource=item=>item.project||item.website||(item.url?'1688':item.source);

function lampDisplayName(entry){

function imageForLamp(item){

function lampAdmitted(item){return item.source==='商品参考'?Boolean(item.url):!item.aiMark&&!item.watermark}
function lightConditionMap(needs){
  const selected=new Map();
  for(const [key,value] of needs){
    const label=key==='材质'?'工艺':key;
    if((Object.hasOwn(lampFields,label)||label.startsWith('自定义:')||label.startsWith('尺寸:'))&&compact(value))selected.set(label,compact(value));
  }
  return [...selected];
}
function dimensionMm(value){
  const parts=String(value).match(/(\d+(?:\.\d+)?)\s*(毫米|厘米|mm|cm|米|m)/i);
  if(!parts)return null;
  return Number(parts[1])*(/^(cm|厘米)$/i.test(parts[2])?10:/^(m|米)$/i.test(parts[2])?1000:1);
}
function numericLampMatch(expected,fact){
  const wanted=String(expected).match(/^\s*(>=|<=|≥|≤|>|<)?\s*(\d+(?:\.\d+)?)/);
  const known=String(fact).match(/(\d+(?:\.\d+)?)/);
  if(!wanted||!known||/[<>≥≤~～至]|[0-9]\s*[-–—]\s*[0-9]/.test(fact))return null;
  const required=Number(wanted[2]),actual=Number(known[1]);
  if(wanted[1]==='>='||wanted[1]==='≥')return actual>=required;
  if(wanted[1]==='<='||wanted[1]==='≤')return actual<=required;
  if(wanted[1]==='>')return actual>required;
  if(wanted[1]==='<')return actual<required;
  return actual===required;
}
function lampMatches(needs,entry){
  const results=lightConditionMap(needs).map(([label,expected])=>{
    const excluded=expected.startsWith('排除 '),want=excluded?expected.slice(3):expected;
    if(label.startsWith('尺寸:')){
      const axis=label.slice(3),mapping=searchDimensionAxes[axis];
      if(!mapping)return {key:axis,label,status:'unknown',fact:'',expected};
      const [field,notation]=mapping;
      const structured=compact(entry.specs?.[field]);
      const axisPattern=new RegExp('(?:'+notation+')\\s*[:：=]?\\s*(\\d+(?:\\.\\d+)?)\\s*(毫米|厘米|mm|cm|米|m)?','i');
      const matched=compact(entry.facts?.尺寸).match(axisPattern);
      const source=structured||(matched?matched[1]+' '+(matched[2]||'mm'):'');
      const actual=dimensionMm(source)||(/^\d+(?:\.\d+)?$/.test(source)?Number(source):null);
      const required=dimensionMm(want);
      if(actual===null||required===null)return {key:axis,label,status:'unknown',fact:source,expected};
      const same=Math.abs(required-actual)<=(/约/.test(want)?required*.1:0);
      return {key:axis,label,status:same!==excluded?'yes':'no',fact:actual+' mm',expected};
    }
    if(label.startsWith('自定义:')){
      const name=label.slice(4),facts=entry.facts||{};
      const fact=compact(Object.hasOwn(facts,name)?facts[name]:Object.hasOwn(entry.specs||{},name)?entry.specs[name]:'');
      if(fact)return {key:name,label,status:fact.toLowerCase().includes(want.toLowerCase())!==excluded?'yes':'no',fact,expected};
      const available=compact([entry.name,entry.note,...Object.values(facts),...Object.values(entry.specs||{})].join(' '));
      const found=name===want&&available.toLowerCase().includes(want.toLowerCase());
      return {key:name,label,status:found?(excluded?'no':'yes'):'unknown',fact:found?want:'',expected};
    }
    const key=lampFields[label],fact=key==='图片主色'?findPictureColor(entry):entry.facts?.[key]||'';
    if(!fact)return {key,label,status:'unknown',fact,expected};
    const clean=value=>String(value).replace(/\s|大约|约/g,'').split(/[，、]/)[0].toLowerCase().replace('拉丝黄铜','黄铜拉丝');
    const left=clean(key==='头数'?normalizeHeads(want):want),right=clean(key==='头数'?normalizeHeads(fact):fact);
    let same=Boolean(left&&right)&&(left.includes(right)||right.includes(left));
    if(key==='头数')same=left===right||(left==='多头'&&Number(right.replace('头',''))>1);
    if(key==='空间')same=String(fact).split(/[、，/,]/).some(space=>clean(space)&&left.includes(clean(space)));
    if(key==='尺寸'){
      const required=dimensionMm(want),actual=dimensionMm(fact);
      if(required!==null&&actual!==null)same=Math.abs(required-actual)<= (/约/.test(expected)?required*.1:0);
    }
    if(key==='光色'){
      const wanted=left.match(/(\d{4})k/),known=right.match(/(\d{4})k/);
      if(wanted&&known)same=wanted[1]===known[1];
      else if(wanted&&!known)return {key,label,status:'unknown',fact,expected};
      else if(!wanted&&known&&/暖/.test(left))same=Number(known[1])<=3300;
    }
    if(key==='电压'||key==='显指'){
      same=numericLampMatch(want,fact);
      if(same===null)return {key,label,status:'unknown',fact,expected};
    }
    return {key,label,status:(same!==excluded)?'yes':'no',fact,expected};
  });
  const yes=results.filter(item=>item.status==='yes').length;
  return {yes,total:results.length,results};
}

function lampResults(message,tab){
  const source=lampTabs.find(([key])=>key===tab)?.[1];
  return allLamps().filter(item=>item.source===source&&lampAdmitted(item)&&canFindOnSource(item)&&item.id!==message.excludeId)
    .map(entry=>({entry,match:lampMatches(message.needs,entry)}))
    .filter(({entry,match})=>{
      if(message.findPlan?.literal&&![entry.name,entry.project,...Object.values(entry.facts||{})].join(' ').toLowerCase().includes(message.findPlan.keyword.toLowerCase()))return false;
      return source==='商品参考'||match.yes*2>=match.total;
    })
    .sort((a,b)=>b.match.yes-a.match.yes||a.match.results.filter(x=>x.status==='no').length-b.match.results.filter(x=>x.status==='no').length);
}
function latestSelection(session){
  for(let index=session.messages.length-1;index>=0;index--){
    const item=session.messages[index];
    if(item.kind==='lights')return {index,result:item};
    if(item.jobType==='lights')return {index,result:item.result};
  }
  return {};
}
const jobDetails={
  customer:{tool:'客户跟进',phases:['核对对话内容与说话人','提炼需求并检查回复草稿']},
  lights:{tool:'灯具选型',phases:['查找各来源的灯具','检查逐项匹配结果']}
};
function runJob(session,type,result,fail=false,retryIndex=-1){
  const spec=jobDetails[type],index=retryIndex<0?session.messages.length:retryIndex;
  let previous=session.messages[index];
  const setMessage=message=>{
    if(session.messages[index]!==previous)return;
    session.messages[index]=message;previous=message;persist();
    if(['work','find'].includes(view.page)&&chat()===session)render(retryIndex<0||isFindPage());
  };
  const base={kind:'working',tool:spec.tool,text:spec.phases[0],jobType:type,result};
  setMessage(base);
  setTimeout(()=>setMessage({...base,text:spec.phases[1]}),520);
  setTimeout(()=>setMessage(fail?{kind:'error',tool:spec.tool,text:'素材来源暂时不可用。已保留找灯条件，可重试。',jobType:type,result}:result),1140);
}
function addLampMessage(session,needs,options={}){
  const active=lightConditionMap(needs);
  session.pending='lights';
  if(!active.length&&options.index==null){
    session.messages.push({kind:'text',tool:'灯具选型',text:'请补充灯型、使用空间或风格，我会据此找款。'});
    persist();render(true);return;
  }
  const finding=isFindPage();
  const result={kind:'lights',tool:'灯具选型',needs:active,tab:options.tab||(finding?'platform':'enterprise'),
    text:options.summary||'已按这些条件找款。可继续在对话中补充要求。',
    projectId:options.projectId??session.projectId,customerId:options.customerId??session.customerId,
    ...(options.excludeId?{excludeId:options.excludeId}:{}),...(options.undo?{undo:options.undo}:{}),
    ...(options.findPlan?{findPlan:options.findPlan}:{})};
  if(!finding&&options.index==null&&!lampResults(result,result.tab).length){
    result.tab=lampTabs.find(([key])=>lampResults(result,key).length)?.[0]||result.tab;
  }
  runJob(session,'lights',result,Boolean(options.fail),options.index??-1);
}

function pluginStatus(){
  const logged=managedSites.filter(site=>siteIsReady(site.name)).length;

function sourceLoginHint(tab){
  if(tab==='enterprise'||!isSales())return '';
  const label=tab==='goods'?'商品参考':'平台库';
  const sites=managedSites.filter(site=>site.use===label);
  const missing=sites.filter(site=>!siteIsReady(site.name));

let pluginStep='';
function placePluginPopover(){
  const panel=$('pluginPopover'),anchor=$('pluginTop');
  if(panel.hidden||!anchor.getBoundingClientRect)return;
  const {bottom,right}=anchor.getBoundingClientRect();
  const viewport=document.documentElement.clientWidth;
  panel.style.left=Math.max(8,Math.min(right-panel.offsetWidth,viewport-panel.offsetWidth-8))+'px';
  panel.style.top=(bottom+7)+'px';
  panel.style.maxHeight=Math.max(112,window.innerHeight-bottom-15)+'px';
}
function closePluginPopover(restoreFocus=false){
  const panel=$('pluginPopover'),anchor=$('pluginTop');
  panel.hidden=true;pluginStep='';
  anchor.setAttribute?.('aria-expanded','false');
  if(restoreFocus)anchor.focus?.({preventScroll:true});
}
function togglePluginPopover(){
  if(!allowSales())return;
  const panel=$('pluginPopover');
  if(!panel.hidden){closePluginPopover(true);return}
  panel.hidden=false;pluginStep='';
  $('pluginTop').setAttribute?.('aria-expanded','true');
  renderPluginPopover(true);
}

function lampArt(entry,viewBox='0 0 290 163'){
  const n=Number(entry.id.slice(1)),finish=n%3===0?'#b9a68d':n%3===1?'#9a6e43':'#bc8d52',wall=entry.facts.灯型==='壁灯',ring=/环|层/.test(entry.name);

  const heads=Number(String(entry.facts.头数||'').match(/^\d+/)?.[0])||1;
  const multi=heads>1&&heads<7?`<path d="M145 0v32M75 32h140" stroke="#65574a" stroke-width="2" fill="none"/>${Array.from({length:heads},(_,index)=>{
    const x=75+index*140/(heads-1);
    return `<path d="M${x} 32v39" stroke="#65574a" stroke-width="2"/><circle cx="${x}" cy="90" r="18" fill="url(#glass)" stroke="${finish}"/><circle cx="${x}" cy="89" r="6" fill="#fff1b1"/>`;
  }).join('')}`:'';
  const fixture=multi||(wall?'<path d="M88 52h36v13H89m33-7v22h33" fill="none" stroke="#604934" stroke-width="8"/><circle cx="166" cy="78" r="19" fill="#f4dfb2"/>':
    ring?`<path d="M145 0L93 82m52-82l53 82" fill="none" stroke="#6f6256" stroke-width="1.5"/><ellipse cx="145" cy="84" rx="68" ry="22" fill="none" stroke="${finish}" stroke-width="8"/><ellipse cx="145" cy="89" rx="66" ry="19" fill="none" stroke="#ffedb7" stroke-width="4"/><ellipse cx="145" cy="112" rx="45" ry="14" fill="none" stroke="${finish}" stroke-width="7"/><ellipse cx="145" cy="116" rx="43" ry="12" fill="none" stroke="#ffedb7" stroke-width="3"/>`:
    `<path d="M145 0v64" stroke="#65574a" stroke-width="2"/><path d="M135 63h20v16h-20z" fill="${finish}"/><path d="M136 75Q108 81 96 119Q145 136 194 119Q182 81 154 75Z" fill="url(#glass)" stroke="${finish}" stroke-width="1.5"/><ellipse cx="145" cy="118" rx="47" ry="10" fill="#ead4a8" opacity=".62"/><path d="M148 85v22" stroke="#fff1b1" stroke-width="5" stroke-linecap="round"/>`);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${viewBox}"><defs><linearGradient id="wall" x1="0" x2="1" y2="1"><stop stop-color="#ede6d9"/><stop offset="1" stop-color="#bcb0a0"/></linearGradient><linearGradient id="glass"><stop stop-color="#7f573e" stop-opacity=".65"/><stop offset=".4" stop-color="#fff0bf" stop-opacity=".63"/><stop offset="1" stop-color="#99764f" stop-opacity=".79"/></linearGradient></defs><rect width="290" height="163" fill="url(#wall)"/><path d="M11 0h5v163h-5m234-163h2v163h-2" fill="#8c7c6a" opacity=".18"/><ellipse cx="150" cy="145" rx="75" ry="7" fill="#8c745e" opacity=".15"/>${fixture}</svg>`;
  return 'data:image/svg+xml,'+encodeURIComponent(svg);
}

function lampMatchBadge(match){
  if(!match.total)return '';
  const percent=Math.round(match.yes/match.total*100);
  const grouped=[['yes','符合'],['no','不符合'],['unknown','待核实']];
  return `<section class="demand-match">
    <button type="button" class="demand-match-trigger" aria-expanded="false" aria-label="${percent}% 符合，${match.yes} / ${match.total} 项，查看符合范围">
      <b>${percent}% 符合</b><span>${match.yes} / ${match.total} 项</span>
    </button>
    <div class="demand-match-details" hidden>${grouped.map(([key,label])=>{
      const matches=match.results.filter(item=>item.status===key);
      if(!matches.length)return '';
      return `<div class="demand-match-row ${key}"><strong>${label}</strong><ul>${matches.map(item=>
        `<li>${esc(findConditionLabel(item.label||item.key))}：${esc(item.expected)}${key==='no'&&item.fact?` <small>实际为 ${esc(item.fact)}</small>`:''}</li>`
      ).join('')}</ul></div>`;
    }).join('')}</div>
  </section>`;
}
let pinnedMatchBadge=null;
function bindLampMatchBadge(badge){
  const trigger=badge.querySelector('.demand-match-trigger'),details=badge.querySelector('.demand-match-details');
  let hover=false,pinned=false,dismissed=false;
  function sync(){
    const open=pinned||(hover&&!dismissed);
    trigger.setAttribute('aria-expanded',String(open));details.hidden=!open;
  }
  const dismiss=()=>{
    pinned=false;dismissed=true;
    if(pinnedMatchBadge?.element===badge)pinnedMatchBadge=null;
    sync();
  };
  badge.addEventListener('pointerenter',event=>{if(event.pointerType!=='touch'){hover=true;dismissed=false;sync()}});
  badge.addEventListener('pointerleave',()=>{hover=false;sync()});
  trigger.addEventListener('click',()=>{
    if(pinned){dismiss();return}
    pinnedMatchBadge?.dismiss();pinned=true;dismissed=false;pinnedMatchBadge={element:badge,dismiss};sync();
  });
  badge.addEventListener('keydown',event=>{
    if(event.key==='Escape'){event.stopPropagation();dismiss();trigger.focus()}
  });
}
document.addEventListener('click',event=>{
  if(pinnedMatchBadge&&!pinnedMatchBadge.element.contains(event.target))pinnedMatchBadge.dismiss();
},true);

const tenderFieldAliases={
  '灯具类型':'类型','款式':'类型','适用空间':'空间','材质':'灯罩材质','灯具颜色':'颜色','主色':'图片主色',
  '灯光颜色':'光色','光线':'光色','规格':'尺寸','直径':'尺寸','高度':'尺寸',
  '显色指数':'显指','CRI':'显指','Ra':'显指'

function termsIn(text,terms){
  return terms.flatMap(value=>{
    const index=text.indexOf(value);
    return index<0?[]:[{value,index}];
  }).filter(term=>!terms.some(other=>other!==term.value&&other.includes(term.value)&&
    text.indexOf(other)>=0&&text.indexOf(other)<=term.index&&text.indexOf(other)+other.length>=term.index+term.value.length))
    .sort((a,b)=>a.index-b.index);
}
function textDemandEdits(text){
  const edits=[];
  const fieldNames=['灯身材质','灯罩材质','类型','空间','风格','颜色','图片主色','光色','色温','功率','电压','显指','尺寸','功能',...Object.keys(tenderFieldAliases)];
  const deletePattern=/(?:去掉|删掉|删除|移除|取消|忽略|不限|不限制|不限定)/;
  for(const part of text.split(/[，,。；;！!\n]/)){
    const clause=part.trim();
    if(!clause)continue;
    const isRemoval=deletePattern.test(clause);
    const mentionedFields=isRemoval?termsIn(clause,fieldNames):[];
    if(mentionedFields.length){
      mentionedFields.forEach(({value})=>edits.push({field:tenderFieldAliases[value]||value,remove:true}));
      continue;
    }
    for(const [field,values] of Object.entries(demandVocabulary)){
      const scoped=field==='灯身材质'?'灯身|灯体|灯杆':field==='灯罩材质'?'灯罩|罩面':'';
      for(const {value,index} of termsIn(clause,values)){
        const prefix=clause.slice(Math.max(0,index-12),index);
        if(field==='灯身材质'&&!new RegExp(scoped+'|灯体|支架').test(prefix))continue;
        if(field==='灯罩材质'&&/(灯身|灯体|灯杆|支架)[^，,]{0,8}$/.test(prefix)&&!/灯罩/.test(prefix))continue;
        if(field==='颜色'&&/(灯光|光线)[^，,]{0,5}$/.test(prefix))continue;
        const negative=/(?:不要|不想要|避免|排除|别用|不考虑)[^，,]{0,3}$/.test(prefix);
        edits.push({field,value,source:'对话',exclude:negative,remove:isRemoval});
      }
    }
    const numericFields=[
      ['色温',/(\d{3,5})\s*(K|开尔文)/gi,'K'],
      ['功率',/(\d+(?:\.\d+)?)\s*(W|瓦)/gi,'W'],
      ['尺寸',/(直径|长度|宽度|高度|尺寸|Ø|Φ)?\s*(约|大约|大概)?\s*(\d+(?:\.\d+)?)\s*(mm|cm|m|毫米|厘米|米)(左右)?/gi,'']
    ];
    for(const [field,pattern,unit] of numericFields){
      for(const match of clause.matchAll(pattern)){
        const dimensions=field==='尺寸';
        const axis=dimensions?(match[1]||'').replace(/Ø|Φ/i,'直径'):'';
        const approximate=dimensions&&Boolean(match[2]||match[5]);
        const amount=Number(match[dimensions?3:1]);
        const measure=dimensions?match[4].toLowerCase():unit;
        const display=dimensions?((axis?axis+' ':'')+(approximate?'约':'')+amount+' '+measure):(amount+' '+unit);
        edits.push({field,value:display,source:'对话',amount,unit:measure,axis,approximate,remove:isRemoval});
      }
    }
    const voltage=clause.match(/电压\s*[：:为]?\s*(\d+(?:\.\d+)?)(?:\s*(?:V\b|伏特?))?|(\d+(?:\.\d+)?)\s*(?:V\b|伏特?)/i);
    if(voltage){
      const value=voltage[1]||voltage[2];
      edits.push({field:'电压',value:value+' V',source:'对话',amount:Number(value),unit:'V',remove:isRemoval});
    }
    const cri=clause.match(/(?:显色指数|显指|\bCRI|\bRa)\s*[：:为]?\s*(>=|<=|≥|≤|>|<)?\s*(\d+(?:\.\d+)?)|(\d+(?:\.\d+)?)\s*(?:CRI|Ra)\b/i);
    if(cri){
      const value=cri[2]||cri[3];
      edits.push({field:'显指',value:(cri[1]||'')+value,source:'对话',amount:Number(value),remove:isRemoval});
    }
  }
  return edits;
}
const findDemoShapes={

let findShapeExamples;
function findPixelSignature(image,canvas){
  canvas.width=24;canvas.height=24;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  ctx.fillStyle='#fff';ctx.fillRect(0,0,24,24);ctx.drawImage(image,0,0,24,24);
  return ctx.getImageData(0,0,24,24).data;
}
async function readVisibleLampTraits(bitmap){
  findShapeExamples||=Promise.all(Object.entries(findDemoShapes).map(async ([key,traits])=>{
    const image=new Image();image.src=imageForLamp(findLamp(key));
    try{await image.decode();return {traits,pixels:findPixelSignature(image,document.createElement('canvas'))}}
    catch{return null}
  }));
  const pixels=findPixelSignature(bitmap,document.createElement('canvas'));
  const ranked=(await findShapeExamples).filter(Boolean).map(example=>{
    let difference=0;
    for(let i=0;i<pixels.length;i++)difference+=Math.abs(pixels[i]-example.pixels[i]);
    return {traits:example.traits,score:difference/(pixels.length*255)};
  }).sort((a,b)=>a.score-b.score);
  if(ranked[0]?.score<.018&&(!ranked[1]||ranked[0].score<ranked[1].score*.65))return ranked[0].traits;
  if(typeof window.TextDetector==='function'){
    try{
      const parts=await new window.TextDetector().detect(bitmap);
      return findNeeds(parts.map(part=>part.rawValue).join(' '),[])
        .filter(([field])=>['灯型','灯罩造型','头数','灯身构造'].includes(field));
    }catch{}
  }
  return [];
}
async function readFindPhoto(file){
  let bitmap;
  try{
    bitmap=await createImageBitmap(file);
    const canvas=document.createElement('canvas');
    const scale=Math.min(1,144/Math.max(bitmap.width,bitmap.height));
    canvas.width=Math.max(1,Math.round(bitmap.width*scale));
    canvas.height=Math.max(1,Math.round(bitmap.height*scale));
    canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);
    const preview=canvas.toDataURL('image/webp',.68);
    canvas.width=32;canvas.height=32;
    const reader=canvas.getContext('2d',{willReadFrequently:true});
    reader.drawImage(bitmap,bitmap.width*.18,bitmap.height*.18,bitmap.width*.64,bitmap.height*.64,0,0,32,32);
    const pixels=reader.getImageData(0,0,32,32).data,counts=new Map();
    let total=0;
    for(let i=0;i<pixels.length;i+=4){
      const [r,g,b,a]=pixels.subarray(i,i+4);
      const light=Math.max(r,g,b),chroma=light-Math.min(r,g,b);
      if(a<180||chroma<30||light<50)continue;
      total++;
      const segment=light===r?(g-b)/chroma:light===g?(b-r)/chroma+2:(r-g)/chroma+4;
      const hue=(segment*60+360)%360;
      const color=hue<18||hue>=340?'红色系':hue<75?'暖色系':hue<160?'绿色系':hue<275?'蓝色系':'紫色系';
      counts.set(color,(counts.get(color)||0)+1);
    }
    const top=[...counts.entries()].sort((a,b)=>b[1]-a[1])[0];
    const color=total>=100&&top&&top[1]/total>=.6?top[0]:'';
    return {id:id(),name:file.name,preview,color,traits:await readVisibleLampTraits(bitmap)};
  }catch(error){return null}
  finally{bitmap?.close()}
}


const findFieldNames={类型:'灯型',空间:'场景',灯身材质:'工艺',灯罩材质:'灯罩',色温:'光色',图片主色:'图片主色'};
function findNeeds(text,current){
  const initial=/换个方向|清空条件|换一种灯/.test(text)?[]:current;
  const known=new Map(initial),edits=textDemandEdits(text);
  const fallback=makeDraft(text,'','','找灯').needs;
  for(const {label,value} of fallback){
    if(!lampFields[label])continue;
    if(label==='工艺'&&edits.some(edit=>edit.field==='灯罩材质')&&!/灯身|灯体|支架/.test(text)&&!/黄铜|铜|钢|铝/.test(value))continue;
    known.set(label,value);
  }
  for(const edit of edits){
    const key=findFieldNames[edit.field]||edit.field;
    if(edit.remove)known.delete(key);
    else if(lampFields[key]){
      if(key==='颜色')known.delete('图片主色');
      if(key==='光色'&&edit.field==='光色'&&/\d\s*K$/i.test(known.get(key)||'')&&/\d{3,5}\s*K/i.test(text))continue;
      known.set(key,(edit.exclude?'排除 ':'')+edit.value);
    }
  }
  addScopedFindTerms(text,known);
  const loftStyle=text.match(/美式乡村\s*(?:loft\s*)?复古工业风|美式乡村风|乡村工业风|loft\s*(?:复古)?工业风/i)?.[0];
  if(loftStyle)known.set('风格',loftStyle);
  if(known.get('形状')&&(known.get('形状')===known.get('灯罩造型')||known.get('形状')===known.get('灯身构造')))known.delete('形状');
  return lightConditionMap([...known]);
}

const findFilterPriority=['灯型','风格','场景','灯罩','灯罩造型','灯罩质感','头数','工艺','灯身构造','形状','尺寸','光色','安装方式','颜色','图片主色','功率','电压','显指','功能','防护等级'];
function findCandidateMatches(text,pattern){
  const match=text.match(pattern);
  if(!match)return '';
  const prefix=text.slice(Math.max(0,match.index-6),match.index);
  return /不要|排除|避免|不想要/.test(prefix)?'排除 '+match[0]:match[0];
}
function addScopedFindTerms(text,conditions){
  for(const clause of text.split(/[，,。；;\n]/)){
    if(/去掉|删掉|移除|删除|忽略|不限/.test(clause))continue;
    if(/灯罩|罩面|(?:磨砂|哑光|透明|半透明)玻璃/.test(clause)){
      const shape=findCandidateMatches(clause,/飞碟形|碟形|球形|半球形|圆锥形|圆柱形|扇形|花瓣形|鼓形|矩形|圆形|锥形/);
      const texture=findCandidateMatches(clause,/磨砂|哑光|拉丝|波纹|褶皱|半透明|透明|乳白|亮面|纹理/);
      if(shape)conditions.set('灯罩造型',shape);
      if(texture)conditions.set('灯罩质感',texture);
    }
    const body=findCandidateMatches(clause,/(?:不锈钢|铝合金|黄铜|铸铝|铁艺|实木|金属|铜|铝|铁)(?=灯身|灯体|支架)/);
    if(body)conditions.set('工艺',body);
    const structure=findCandidateMatches(clause,/三层环形|多层环形|双环|双层环形|单环|环形|枝形|长盘|圆盘|单杆|多臂|吊链|吊线|线性|可伸缩/);
    if(structure&&(!/灯罩|罩面/.test(clause)||/灯身|灯体|支架/.test(clause)))conditions.set('灯身构造',structure);
    const head=findCandidateMatches(clause,/(?:\d+|单|双|一|二|两|三|四|五|六|七|八|九|十|多)\s*头/);
    if(head)conditions.set('头数',normalizeHeads(head));
    const install=findCandidateMatches(clause,/吊装|壁装|嵌入式|明装|轨道安装|吸顶安装|吊顶安装/);
    if(install)conditions.set('安装方式',install);

    if(protection)conditions.set('防护等级',protection.replace(/\s+/g,'').toUpperCase());
  }
  const requestedRemovals=[['头数','头数|灯头数量'],['灯罩造型','灯罩造型'],['灯罩质感','灯罩质感'],
    ['灯身构造','灯身构造|灯体结构'],['安装方式','安装方式'],['防护等级','防护等级']];
  for(const [key,terms] of requestedRemovals){
    if(new RegExp('(?:去掉|删掉|移除|删除|不限)\\s*(?:'+terms+')').test(text))conditions.delete(key);

}
function normalizeHeads(value){

function startFindMessage(text,photos=[],session=chat(),reuse=false){

  const textFields=new Set(requested.map(([name])=>name));
  requested.push(...imageTraits.filter(([key])=>!textFields.has(key)));
  if(photos.length){
    const names=photos.map(file=>file.name.replace(/\.[^.]+$/,'')).join('，');
    const fileHints=findNeeds(names,[]).filter(([label])=>['灯型','风格','灯罩造型','头数'].includes(label));
    const fields=new Set(requested.map(([name])=>name));
    for(const [key,value] of fileHints){
      if(fields.has(key))continue;
      requested.push([key,value]);fields.add(key);fromFilename=true;
    }
  }
  const colors=[...new Set(photos.map(file=>file.color).filter(Boolean))];
  if(colors.length===1&&!requested.some(([label])=>label==='颜色'||label==='图片主色'))requested.push(['图片主色',colors[0]]);
  const plan=makeFindPlan(requested,{text:clean,fromImage:photos.length>0,fromFilename,imageTraits});
  let active=plan.active;
  if(reuse&&oldText===clean&&lastSelection?.findPlan){
    const defaults=new Map(lastSelection.findPlan.active),saved=new Map(lastSelection.needs);

  }

  if(!lampResults(query,options.tab).length){
    options.tab=lampTabs.find(([key])=>lampResults(query,key).length)?.[0]||options.tab;
  }
  addLampMessage(session,active,{...options,index:1,findPlan:plan});
}

const findPhotoQueue=new WeakMap();
function appendFindPhotos(files){

  const upload=(findPhotoQueue.get(session)||Promise.resolve()).then(async()=>{

    if(supplied.length>room&&isFindPage()&&chat()===session)showToast(`每次找灯最多上传 ${FIND_PHOTO_LIMIT} 张图片`);
    if(room<=0)return;

    if(added.length<inspected.length&&current)showToast('部分图片无法读取，请重新选择');
    if(!added.length)return;

    session.selectedPhotoId=added.at(-1).id;
    startFindMessage(current?view.compose:keyword,photos,session,true);

  render();

    if(findPhotoQueue.get(session)!==upload)return;

      render();
      $('composeForm')?.querySelector('.find-photo-item [aria-pressed="true"]')?.scrollIntoView({block:'nearest',inline:'nearest'});

function findConditionLabel(field){
  if(field.startsWith('尺寸:'))return field.slice(3);
  return field.startsWith('自定义:')?field.slice(4):({灯型:'灯具类型',场景:'适配空间',工艺:'灯身材质',灯罩:'灯罩材质'}[field]||field);
}

function findManualConditions(text){
  const aliases={...findFieldNames,灯具类型:'灯型',适配空间:'场景',适用空间:'场景',灯体材质:'工艺',灯光颜色:'光色',灯头数量:'头数'};
  const excludedValue=value=>value.replace(/^(?:不要|不想要|排除|避免)\s*(?=\S)/,'排除 ');
  return lightConditionMap(text.split(/[\n；;，,]+/).flatMap(part=>{
    const clause=compact(part);
    if(!clause)return [];
    const pair=clause.match(/^([^:：]+)[：:]\s*(.+)$/);
    if(pair){
      const label=compact(pair[1]),value=excludedValue(compact(pair[2])),field=aliases[label]||label;
      const axis=label.replace(/度$/,'');
      if(Object.hasOwn(searchDimensionAxes,axis))return [['尺寸:'+axis,value]];
      return [[Object.hasOwn(lampFields,field)?field:'自定义:'+label,value]];
    }
    if(/[：:]\s*$/.test(clause))return [];
    const recognized=findNeeds(clause,[]);
    if(recognized.length)return recognized;
    const value=excludedValue(clause);
    if(value.startsWith('排除 ')&&/亮金|哑黑|乳白|[黑白金银]色/.test(value))return [['颜色',value]];
    return [['自定义:'+value.replace(/^排除 /,''),value]];
  }));
}

const findExamples=[
  ['灯型','吊灯、壁灯'],['灯罩','磨砂玻璃、布艺'],['风格','美式乡村风、中古风'],
  ['场景','餐厅、床头'],['头数','单头、三头'],['工艺','黄铜、拉丝铁'],
  ['灯身构造','双环、线性灯身'],['尺寸','小巧、体量偏大'],['光色','暖光、中性光']
];
function findKeywordPhrase(conditions,original=''){
  const positive=new Map(conditions.filter(([,value])=>value&&!value.startsWith('排除 ')));
  const take=key=>positive.get(key)||'';
  const headlines=[];
  const identity=[take('场景'),take('风格'),take('头数'),take('灯型')].filter(Boolean).join('');
  if(identity)headlines.push(identity);
  const shade=[take('灯罩造型'),take('灯罩质感'),take('灯罩')].filter(Boolean).join('');
  if(shade)headlines.push(shade+'灯罩');
  const body=[take('工艺'),take('灯身构造')].filter(Boolean).join('');
  if(body)headlines.push(body+'灯身');
  for(const key of ['形状','颜色','光色','尺寸','安装方式','功率','功能','防护等级','图片主色']){
    if(take(key))headlines.push(take(key));
  }
  for(const field of ['电压','显指']){
    if(take(field))headlines.push(field+' '+take(field));
  }
  for(const [field,value] of conditions){
    if(value.startsWith('排除 '))headlines.push('排除'+findConditionLabel(field)+' '+value.slice(3));
  }
  return headlines.join(' · ')||original;
}

function readLampSpecs(data={}){
  return Object.fromEntries([...lampSpecText,...lampSpecAxes,...lampCutoutAxes]
    .map(([key])=>[key,compact(data?.[key])]).filter(([,value])=>value));
}
function lampSpecFields(specs={}, {caseMode=false}={}){
  const metric=(key,label,unit,compactAxis=false)=>`<label class="field${compactAxis?' spec-axis':''}">${compactAxis?'':esc(label)}<span class="case-unit">
    <input inputmode="decimal" name="${key}" value="${esc(specs[key])}" aria-label="${esc(label+'，'+unit)}" ${compactAxis?`placeholder="${esc(label)}"`:''}><small aria-hidden="true">${unit}</small></span></label>`;
  const axes=(title,fields)=>`<fieldset class="spec-axes"><legend>${title}（mm）</legend><div class="field-grid">
    ${fields.map(([key,label],index)=>metric(key,label,(fields===lampCutoutAxes?['Φ','L','W']:['Φ','L','W','H'])[index],true)).join('')}</div></fieldset>`;
  return `<div class="field-grid lamp-spec-fields${caseMode?' case-spec-fields':''}">
    ${lampSpecText.slice(0,-1).map(([key,label,unit])=>unit?metric(key,label,unit):field(label,key,specs[key])).join('')}
    ${axes('尺寸',lampSpecAxes)}${axes('开孔尺寸',lampCutoutAxes)}
    ${textField('补充规格','extraSpec',specs.extraSpec||'','rows="2"')}</div>`;
}
function lampSpecSummary(specs={}){
  const params=readLampSpecs(specs);
  const withUnit=(value,unit)=>unit&&!value.toLowerCase().endsWith(unit.toLowerCase())?value+' '+unit:value;
  const summary=lampSpecText.filter(([key])=>params[key]).map(([key,label,unit])=>label+' '+withUnit(params[key],unit));
  for(const [title,axes] of [['尺寸',lampSpecAxes],['开孔尺寸',lampCutoutAxes]]){
    const sizes=axes.filter(([key])=>params[key]).map(([key,label])=>label+' '+withUnit(params[key],'mm'));
    if(sizes.length)summary.push(title+' '+sizes.join(' × '));
  }
  return summary.join(' · ');
}
function projectLampSpecEditor(specs={},sectionClass=''){
  return `<details class="lamp-specs${sectionClass?' '+sectionClass:''}"${Object.keys(readLampSpecs(specs)).length?' open':''}><summary>灯具参数（选填）</summary>
    ${lampSpecFields(specs)}</details>`;
}
function projectLampQuoted(item){return item?.inquiryStatus==='已询价'}
function projectLampNumber(item){return compact(item?.itemNumber||item?.styleNumber||item?.id)}
function migrateProjectLampData(){
  for(const p of db.projects){
    const snapshot=p.quoteSnapshot;
    const legacyNumbers=new Set(snapshot?.items?.map(item=>item.itemNumber)||[]);
    const legacyLines=p.items.filter(item=>legacyNumbers.has(projectLampNumber(item)));
    p.inquiryHistory ||= [];
    if(snapshot?.items?.length&&!p.inquiryHistory.length){
      p.inquiryHistory.push({id:'legacy-'+p.id,lineIds:legacyLines.map(item=>item.id),createdAt:p.quotedAt||snapshot.generatedOn,snapshot});
    }
    if(p.caseSharing&&p.attachments?.[0]){
      p.caseAttachments ||= {};
      p.caseAttachments.legacy=p.attachments[0];
    }
    for(const item of p.items){
      if(!item.inquiryStatus){
        const wasQuoted=legacyLines.includes(item)||(p.stage==='已询价'&&!legacyNumbers.size);
        item.inquiryStatus=wasQuoted?'已询价':'未询价';
        if(wasQuoted&&p.quotedAt)item.inquiryDate=p.quotedAt;
      }
      if(p.caseSharing&&!item.caseShare){
        const {sharePrice,shareAttachments,sharedAt}=p.caseSharing;
        item.caseShare={sharePrice,shareAttachments,sharedAt,attachmentId:p.caseAttachments?.legacy?'legacy':''};
      }
    }
    delete p.quoteSnapshot;
    delete p.quotedAt;
    delete p.caseSharing;
  }
}

function changeProjectLampSelection(input){
  const pid=input.dataset.projectLampSelectAll||input.dataset.projectLampSelection,p=project(pid);
  if(!p||!isSales())return;
  const element=input.closest('#projectLampManagement'),selected=projectLampSelection(p);

    selected.clear();
    if(input.checked)p.items.forEach(item=>selected.add(item.id));

function loadQuoteImage(src){
  return new Promise((resolve,reject)=>{
    const image=new Image();
    const embedded=/^data:image\//i.test(src);
    const timer=setTimeout(()=>reject(new Error('图片加载超时')),6000);
    image.onerror=()=>{clearTimeout(timer);reject(new Error('图片加载失败'))};
    image.onload=()=>{
      clearTimeout(timer);
      if(!image.naturalWidth||!image.naturalHeight){reject(new Error('图片加载失败'));return}
      if(embedded){resolve(src);return}
      try{
        const canvas=document.createElement('canvas');
        canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;
        canvas.getContext('2d').drawImage(image,0,0);
        const data=canvas.toDataURL('image/png');
        if(!data.startsWith('data:image/'))throw new Error('图片无法内嵌');
        resolve(data);
      }catch(error){reject(error)}
    };
    if(/^https?:\/\//i.test(src))image.crossOrigin='anonymous';
    image.src=src;
  });
}
async function checkedQuote(p){

  preview.busy=true;

    const images=await Promise.allSettled(preview.snapshot.items.map(item=>item.image?loadQuoteImage(item.image):''));
    if(view.quotePreview!==preview)return null;
    if(!preview.historical){
      const lines=readProjectLampIds(p,preview.lineIds).filter(item=>!preview.markOnly||!projectLampQuoted(item));
      if(JSON.stringify(makeQuoteSnapshot(p,preview.snapshot.generatedOn,lines))!==JSON.stringify(preview.snapshot)){
        if(!lines.length)clearAction();

    if(failed.length){showToast('款式 '+failed.join('、')+' 图片加载或内嵌失败，请核对图片后重试');return null}
    return {...preview.snapshot,items:preview.snapshot.items.map((item,index)=>({...item,image:images[index].value}))};
  }finally{preview.busy=false}
}

function quotePriceCents(value){
  const text=compact(value);
  if(!text)return null;
  if(!/^\d+(?:\.\d{1,2})?$/.test(text))return NaN;
  const [whole,decimal='']=text.split('.');
  const cents=Number(whole+decimal.padEnd(2,'0'));
  return Number.isSafeInteger(cents)?cents:NaN;
}
function factoryQuoteTotal(cents,quantity){
  const qty=Number(quantity);
  if(!Number.isSafeInteger(cents)||!Number.isSafeInteger(qty)||qty<=0)return null;
  const total=cents*qty;
  return Number.isSafeInteger(total)?total:null;
}

const quoteMoney=cents=>Number.isSafeInteger(cents)?quoteCurrency.format(cents/100):'—';
const quoteInputAmount=cents=>Number.isSafeInteger(cents)?Math.floor(cents/100)+'.'+String(cents%100).padStart(2,'0'):'';

async function saveFactoryQuote(form,data){
  const p=project(form.dataset.project);
  if(!allowSales()||!p||form.dataset.saving==='true')return;
  const lineIds=form.dataset.lines.split(' '),lines=readProjectLampIds(p,lineIds);

  try{
    const entries=[];
    for(const line of lines){
      const read=key=>compact(data[line.id+':'+key]);
      const purchaseCents=quotePriceCents(read('purchase')),salesCents=quotePriceCents(read('sales'));
      if(Number.isNaN(purchaseCents)||Number.isNaN(salesCents))throw Error(line.name+'的单价请填写非负金额，最多两位小数');
      const file=data[line.id+':file'];
      const attachment=file?.size?await caseAttachmentFromFile(file):p.factoryQuotes?.[line.id]?.attachment;
      const details={supplier:read('supplier'),date:read('date'),spec:read('spec'),note:read('note'),attachment};
      entries.push([line.id,purchaseCents!==null||salesCents!==null||Object.values(details).some(Boolean)?
        {purchaseCents,salesCents,...details}:null]);
    }
    if(!form.isConnected)return;
    const old=p.factoryQuotes,oldCases=db.cases,oldAudit={updatedAt:p.updatedAt,updatedBy:p.updatedBy};
    p.factoryQuotes={...old};
    for(const [lineId,quote] of entries){if(quote)p.factoryQuotes[lineId]=quote;else delete p.factoryQuotes[lineId]}
    touchProject(p);
    try{localStorage.setItem('company-agent-workbench-v1',JSON.stringify(db))}
    catch{p.factoryQuotes=old;db.cases=oldCases;Object.assign(p,oldAudit);throw Error('浏览器存储空间不足，请减少附件后重试')}
    clearAction();render();showToast('工厂报价已保存');
  }catch(error){showToast(error.message||'保存报价失败')}
  finally{form.dataset.saving='false';submit.disabled=false}
}

function sharedCaseFacts(item){
  const s=item.specs||{};
  const dims=[['Φ',s.diameter],['L',s.length],['W',s.width],['H',s.height]].filter(([,value])=>compact(value)).map(([key,value])=>`${key}${value} mm`);
  const cuts=[['Φ',s.cutDiameter],['L',s.cutLength],['W',s.cutWidth]].filter(([,value])=>compact(value)).map(([key,value])=>`${key}${value} mm`);
  return Object.fromEntries([['空间',item.space],['灯型',s.category],['颜色',s.color],['材质',s.material],
    ['光色',compact(s.cct)?s.cct+' K':''],['显指',compact(s.cri)?'Ra '+s.cri:''],['功率',compact(s.power)?s.power+' W':''],
    ['尺寸',dims.join(' · ')],['开孔尺寸',cuts.join(' · ')],['补充规格',s.extraSpec]].filter(([,value])=>compact(value)));
}
function syncSharedProjectCases(p){
  const sharedItems=p.items.filter(item=>item.caseShare);
  const previousCases=db.cases.filter(entry=>entry.sourceProjectId===p.id);
  if(!sharedItems.length&&!previousCases.length&&!p.caseAttachments)return;
  const previous=new Map(previousCases.map(entry=>[entry.sourceLineId,entry]));
  const next=new Map(sharedItems.map(item=>{
    const {sharePrice,shareAttachments,sharedAt,attachmentId,sharedBy,ownerAccountId}=item.caseShare;
    const quote=p.factoryQuotes?.[item.id];
    const current=previous.get(item.id);
    const attachment=p.caseAttachments?.[attachmentId];
    const shared={project:p.name,projectCode:p.code,sharePrice,shareAttachments,
      historySale:sharePrice?quoteInputAmount(quote?.salesCents):'',attachments:shareAttachments&&attachment?[{name:attachment.name,fromProject:true,attachmentId}]:[]};
    if(current)return [item.id,{...current,...shared}];
    const photos=[...new Set([imageForLamp(item),...(item.photos||[])].filter(Boolean))].slice(0,5);
    return [item.id,{id:`shared-case-${p.id}-${item.id}`,source:'企业库',sourceProjectId:p.id,sourceLineId:item.id,
      name:item.name,space:item.space||'公共空间',quantity:item.qty??'',unit:item.unit||'',specs:{...item.specs},facts:sharedCaseFacts(item),
      note:item.designNote||'',thumbnail:photos[0]||'',photos,createdBy:sharedBy||p.createdBy,createdAt:sharedAt,
      ownerAccountId:ownerAccountId??caseOwnerAccountId(p),...shared}];
  }));
  const incoming=[...next].filter(([lineId])=>!previous.has(lineId)).map(([,entry])=>entry);
  db.cases=[...incoming,...db.cases.flatMap(entry=>entry.sourceProjectId!==p.id?[entry]:next.has(entry.sourceLineId)?[next.get(entry.sourceLineId)]:[])];
  if(p.caseAttachments){
    const inUse=new Set(sharedItems.map(item=>item.caseShare.attachmentId));
    p.caseAttachments=Object.fromEntries(Object.entries(p.caseAttachments).filter(([key])=>inUse.has(key)));
  }
}

const listPaging={};
function pageSlice(scope,rows,defaultSize=20){
  const paging=listPaging[scope]||{page:1,pageSize:defaultSize};
  const total=rows.length,pages=Math.max(1,Math.ceil(total/paging.pageSize));
  const page=Math.min(paging.page,pages),offset=(page-1)*paging.pageSize;
  listPaging[scope]={page,pageSize:paging.pageSize};
  return {rows:rows.slice(offset,offset+paging.pageSize),page,pageSize:paging.pageSize,total,pages};
}

function caseDimensionsFromText(text,keys){
  const converted={};
  let rest=compact(text).replace(/×/g,'x');
  if(!rest)return {converted,rest};
  const numeric=/^(\d+(?:\.\d+)?)\s*(?:(毫米|厘米|mm|cm|米|m))?$/i.exec(rest);
  if(numeric&&keys.length===3)return {converted:{[keys[0][0]]:caseMillimeters(numeric[1],numeric[2])},rest:''};
  for(const [key,label,symbol] of keys){
    const words=key==='diameter'||key==='cutDiameter'?'直径|[φΦØø]':label+'|'+symbol;
    const match=new RegExp('(?:'+words+')\\s*(?:[:：=]\\s*)?(\\d+(?:\\.\\d+)?)\\s*(毫米|厘米|mm|cm|米|m)?','i').exec(rest);
    if(!match)continue;
    converted[key]=caseMillimeters(match[1],match[2]);
    rest=rest.slice(0,match.index)+rest.slice(match.index+match[0].length);
  }
  const labeled=Object.keys(converted).length;
  if(labeled&&!rest.replace(/[·xX*\s,，、／/;；]+/g,''))return {converted,rest:''};

    canvas.width=Math.max(1,Math.round(bitmap.width*ratio));canvas.height=Math.max(1,Math.round(bitmap.height*ratio));
    canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);

  }finally{bitmap.close()}
}

function parseCaseExcelRows(rows){
  const header=rows.findIndex(row=>Array.from(row.cells.values()).includes('产品名称'));
  if(header<0)throw new Error('找不到“产品名称”列，请下载模板');
  const accepted=new Map([...caseExcelColumns,...caseExcelAliases]);
  const columns=Array.from(rows[header].cells).flatMap(([column,label])=>accepted.has(label)?[[column,accepted.get(label)]]:[]);
  if(new Set(columns.map(([,key])=>key)).size!==columns.length)throw new Error('存在重复字段列，请删除重复列后重新上传');
  const result=[];
  for(const row of rows.slice(header+1)){
    const values=Object.fromEntries(columns.map(([column,key])=>[key,compact(row.cells.get(column))]));
    if(!Object.values(values).some(Boolean))continue;
    const size=caseDimensionsFromText(values.size,caseDimensions),cut=caseDimensionsFromText(values.cutout,caseCutDimensions);
    const specs=Object.fromEntries(Object.keys(caseSpecLabels).map(key=>[key,values[key]||'']));
    Object.assign(specs,size.converted,cut.converted);
    specs.cct=caseMetricValue(specs.cct,'K');specs.cri=caseMetricValue(specs.cri,'CRI');specs.power=caseMetricValue(specs.power,'W');
    specs.extraSpec=[specs.extraSpec,size.rest&&'尺寸 '+size.rest,cut.rest&&'开孔尺寸 '+cut.rest].filter(Boolean).join(' · ');
    const draft={...values,specs,sale:casePriceValue(values.sale),photos:[]};
    result.push({number:row.number,draft,issue:validateCaseDraft(draft)});
  }
  if(!result.length)throw new Error('Excel 中没有灯具明细');
  return result;
}

function excelZip(bytes){
  const data=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
  if(bytes.length<22)throw new Error('无法打开 Excel 文件');
  const decoder=new TextDecoder();
  const endMin=Math.max(0,bytes.length-65557);
  let end=bytes.length-22;
  while(end>=endMin&&data.getUint32(end,true)!==0x06054b50)end--;
  if(end<endMin)throw new Error('无法打开 Excel 文件');
  const entries=new Map();
  let offset=data.getUint32(end+16,true);
  const count=data.getUint16(end+10,true);
  for(let i=0;i<count;i++){
    if(data.getUint32(offset,true)!==0x02014b50)throw new Error('Excel 文件已损坏');
    const nameLength=data.getUint16(offset+28,true);
    const name=decoder.decode(bytes.subarray(offset+46,offset+46+nameLength));
    entries.set(name,{method:data.getUint16(offset+10,true),size:data.getUint32(offset+20,true),
      expanded:data.getUint32(offset+24,true),localOffset:data.getUint32(offset+42,true)});
    offset+=46+nameLength+data.getUint16(offset+30,true)+data.getUint16(offset+32,true);
  }
  return async path=>{
    const entry=entries.get(path);
    if(!entry)return '';
    if(entry.expanded>32*1024*1024)throw new Error('Excel 工作表超过 32 MB，请拆分后上传');
    if(data.getUint32(entry.localOffset,true)!==0x04034b50)throw new Error('Excel 文件已损坏');
    const start=entry.localOffset+30+data.getUint16(entry.localOffset+26,true)+data.getUint16(entry.localOffset+28,true);
    if(start+entry.size>bytes.length)throw new Error('Excel 文件已损坏');
    const compressed=bytes.subarray(start,start+entry.size);
    if(entry.method===0)return decoder.decode(compressed);
    if(entry.method!==8)throw new Error('Excel 文件压缩格式无法读取');
    const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Response(stream).text();
  };
}
function excelXml(xml){
  if(!xml)return null;
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  if(doc.querySelector('parsererror'))throw new Error('Excel 工作表内容有误');
  return doc;
}
function firstExcelSheet(workbook,relationships){
  const sheets=workbook?.getElementsByTagNameNS('*','sheet')||[];
  const sheet=Array.from(sheets).find(entry=>entry.getAttribute('name')==='灯具明细')||sheets[0];
  if(!sheet)return 'xl/worksheets/sheet1.xml';
  const id=sheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||
    sheet.getAttributeNS('http://purl.oclc.org/ooxml/officeDocument/relationships','id')||sheet.getAttribute('r:id');
  const relation=Array.from(relationships?.getElementsByTagNameNS('*','Relationship')||[])
    .find(entry=>entry.getAttribute('Id')===id);
  const target=relation?.getAttribute('Target');
  return target?new URL(target,'https://excel.invalid/xl/workbook.xml').pathname.slice(1):'xl/worksheets/sheet1.xml';
}
function excelCellText(cell,strings){
  const first=tag=>cell.getElementsByTagNameNS('*',tag)[0]?.textContent||'';
  switch(cell.getAttribute('t')){
    case 's': return strings[Number(first('v'))]||'';
    case 'inlineStr': return Array.from(cell.getElementsByTagNameNS('*','t'),node=>node.textContent).join('');
    case 'e': return '';
    default: return first('v');
  }
}
async function readSchemeExcel(file){
  const read=excelZip(new Uint8Array(await file.arrayBuffer()));
  const [workbook,relationships,shared]=await Promise.all(
    ['xl/workbook.xml','xl/_rels/workbook.xml.rels','xl/sharedStrings.xml'].map(async path=>excelXml(await read(path))));
  const sheet=excelXml(await read(firstExcelSheet(workbook,relationships)));
  if(!sheet)throw new Error('没有找到 Excel 工作表');
  const strings=Array.from(shared?.getElementsByTagNameNS('*','si')||[],item=>
    Array.from(item.getElementsByTagNameNS('*','t'),part=>part.textContent).join(''));
  const rows=Array.from(sheet.getElementsByTagNameNS('*','row'),(row,index)=>{
    const cells=new Map(Array.from(row.getElementsByTagNameNS('*','c'),(cell,column)=>[
      cell.getAttribute('r')?.replace(/\d+$/,'')||String(column),excelCellText(cell,strings).trim()
    ]));
    return {number:row.getAttribute('r')||index+1,cells};
  });
  return parseCaseExcelRows(rows);
}

        form.screenshots.splice(form.screenshots.indexOf(screenshot),1);
        URL.revokeObjectURL(screenshot.url);
        thumb.remove();
        error.hidden=true;
        syncImages();
        uploader.focus();
      });
      uploader.before(thumb);
    }
    syncImages();
  };
  uploader.addEventListener('click',()=>picker.click());
  picker.addEventListener('change',()=>{
    addImages(picker.files);
    picker.value='';
  });
  panel.addEventListener('dragover',event=>{
    if(!event.dataTransfer.types.includes('Files'))return;
    event.preventDefault();
    uploader.classList.add('dragover');
  });
  panel.addEventListener('dragleave',event=>{
    if(!panel.contains(event.relatedTarget))uploader.classList.remove('dragover');
  });
  panel.addEventListener('drop',event=>{
    event.preventDefault();
    uploader.classList.remove('dragover');
    addImages(event.dataTransfer.files);
  });
  syncCrmImportFollow(form);
}
async function crmReadImages(fileList){
  const files=Array.from(fileList||[]);
  if(files.length>crmImportImageLimit)throw Error('每次最多可添加 '+crmImportImageLimit+' 张聊天截图');
  return Promise.all(files.map(async file=>({name:file.name,url:await compressProductImage(file)})));
}
async function crmExtractImageText(images){
  if(!images.length||typeof window.TextDetector!=='function')return '';
  try{
    const detector=new window.TextDetector(),results=[];
    for(const image of images){
      const input=new Image();input.src=image.url;await input.decode();
      const parts=await detector.detect(input);
      results.push(...parts.map(part=>part.rawValue).filter(Boolean));
    }
    return results.join('\n');
  }catch{return ''}
}
async function reviewCrmImportedFollow(form,data){
  if(form.dataset.saving==='true')return;
  form.dataset.saving='true';
  syncCrmImportFollow(form);
  try{
    const isImages=form.dataset.mode==='images';
    const text=isImages?'':String(data.chatText||'').trim();
    const images=isImages?await crmReadImages(form.screenshots.map(item=>item.file)):[];
    if(!text&&!images.length){crmFormError(form,'请粘贴聊天记录或添加聊天截图');return}
    const recognized=text||await crmExtractImageText(images);
    if(!form.isConnected)return;
    const scope={projectId:form.dataset.project,customerId:form.dataset.customer},c=customer(scope.customerId);
    const ownAliases=new Set(String(data.ownAliases||'').split(/[，,]/).map(compact).filter(Boolean));
    const clues=recognized.split('\n').filter(line=>!ownAliases.has(compact(line.split(/[:：]/)[0]))).join('\n');
    const draft=makeDraft(clues,scope.customerId,scope.projectId,data.source||'其他',c?.contact||'');
    const summary=draft.needs.map(({label,value})=>label+'：'+value).join('\n');
    const title=(c?.name?c.name+' · ':'')+(summary?'客户需求跟进':images.length?'聊天截图跟进':'聊天记录跟进');
    const hasUnrecognizedImages=images.length&&!recognized;
    followDialog({title,summary,content:recognized,contact:c?.contact,channel:crmFollowChannels.includes(data.source)?data.source:c?.channel,importSource:data.source||'其他'},scope,images);
    if(hasUnrecognizedImages)crmFormError($('crmFollowForm'),'已添加聊天截图，请填写跟进内容或结论后保存。');
  }catch(error){if(form.isConnected)crmFormError(form,error)}
  finally{
    form.dataset.saving='false';
    if(form.isConnected)syncCrmImportFollow(form);
  }
}
async function saveCrmFollow(form,data){
  if(!allowSales()||form.dataset.saving==='true')return;
  const pid=form.dataset.project||data.projectId||'',p=project(pid);
  const cid=p?.customerId||form.dataset.customer||data.customerId||'';
  if((pid&&!p)||(!pid&&!customer(cid))||!compatible(form.dataset.customer||data.customerId,pid)){
    crmFormError(form,'请选择可关联的客户或项目');return;
  }
  const title=compact(data.title),content=String(data.content||'').trim(),summary=String(data.summary||'').trim();
  if(!title||!data.date||!data.channel||(!content&&!summary)){
    crmFormError(form,'请填写标题、跟进方式、日期，以及跟进内容或结论');return;
  }
  const next=compact(data.next);
  if(Boolean(data.due)!==Boolean(next)||(data.dueClock&&!data.due)){
    crmFormError(form,'请同时填写下次跟进日期和事项');return;
  }
  const send=form.querySelector('button[type="submit"]');form.dataset.saving='true';send.disabled=true;
  try{
    const images=form.crmImages?.length?form.crmImages:await crmReadImages(form.elements.images?.files);
    const attachments=await Promise.all(Array.from(form.elements.attachments?.files||[]).map(caseAttachmentFromFile));
    if(!form.isConnected)return;
    const line={id:id(),title,customerId:cid,projectId:pid,lampId:p?.items.find(item=>item.id===data.lampId)?.id||'',
      channel:data.channel,date:data.date,clock:data.clock,contact:compact(data.contact),direction:data.direction,
      content,summary,due:data.due,dueClock:data.dueClock,next,images,attachments,importSource:data.importSource||'',createdBy:roles[view.role].name};
    const oldFollow=db.follow,oldRecords=db.records,oldStage=p?.stage;
    if(p&&projectStages.includes(data.afterStage))p.stage=data.afterStage;
    const recurring=data.due?{id:id(),customerId:cid,projectId:pid,title:next,due:data.due,clock:data.dueClock,done:false,recordId:line.id}:null;
    db.records=[line,...db.records];
    db.follow=db.follow.map(item=>item.id===form.dataset.task?{...item,done:true}:item);
    if(recurring)db.follow.push(recurring);
    try{localStorage.setItem('company-agent-workbench-v1',JSON.stringify(db))}
    catch{db.follow=oldFollow;db.records=oldRecords;if(p)p.stage=oldStage;throw Error('浏览器存储空间不足，请减少截图后重试')}
    closeCrmDialog();render();showToast('已保存跟进');
  }catch(error){if(form.isConnected)crmFormError(form,error)}
  finally{form.dataset.saving='false';send.disabled=false}
}

      ${selectField('项目','projectId',chat().projectId,db.projects.map(x=>[x.id,x.name]),'暂不关联')}

    openCrmCustomer();
  }else if(action==='edit-customer-needs'){
    if(!allowSales())return;
    const c=customer(key);if(!c)return;
    const value=c.needText||(c.needs||[]).map(([label,condition])=>label+' '+condition).join('，');
    openCrmDialog('编辑客户需求',`<form id="editCustomerNeedsForm" data-customer="${esc(c.id)}">${textField('客户需求','needs',value,'rows="5"')}${crmFormButtons('保存需求')}</form>`);
  }else if(action==='new-project'){
    openProjectEditor(null,customer(key)?.id||'');
  }else if(action==='edit-project'){
    const entry=project(key);if(entry)openProjectEditor(entry);
  }else if(action==='edit-project-portrait'){
    const entry=project(key);if(!entry||!allowSales())return;
    showAction('编辑项目画像',`<form id="projectPortraitForm" data-project="${esc(entry.id)}">
      ${textField('项目画像','portrait',entry.portrait||'','rows="6" placeholder="记录设计方向、预算、交付要求或决策人"')}${formButtons('保存画像')}</form>`);
  }else if(action==='demo'){
    const scenarios=[
      ['intake','导入模拟聊天截图','核对原文、登记需求，并联动找灯'],
      ['missing','验证参数缺失','发一句「帮我找灯」，再补充必要条件'],
      ['failed','体验检索失败与重试','保留已确认条件，重试后返回选型结果']
    ];
    showAction('模拟场景',`<p class="muted" style="margin:4px 0 10px">当前客户、任务、截图和灯具均为模拟数据。可以自由体验各步骤。</p>
      <div class="tool-grid">${scenarios.map(([key,title,note])=>`<section class="box"><div class="row spread"><h3>${esc(title)}</h3>${button('进入','run-scenario',key)}</div><p class="muted">${esc(note)}</p></section>`).join('')}</div>`);
  }else if(action==='run-scenario'){
    clearAction();
    if(key==='intake'){
      newChat('c1','p1');prepareSampleConversation();
    }else if(key==='missing'){
      newChat();startMessage('帮我找灯');
    }else if(key==='failed'){
      const session=newChat('c1','p1');
      session.messages.push({kind:'user',text:'按已登记的酒店大堂需求找灯。'});

document.addEventListener('submit',async event=>{

  if(form.id==='factoryQuoteForm'){await saveFactoryQuote(form,data);return}
  if(form.id==='projectShareForm'){await saveProjectLampShare(form,data);return}
  if(form.id==='lampUnshareForm'){saveProjectLampUnshare(form);return}
  if(form.id==='composeForm'){
    if(isFindPage()){

  }
  if(form.id==='findManualForm'){

    if(!manual.length){showToast('请填写完整的筛选条件');return}
    addLampMessage(session,[...result.needs,...manual],{index,tab:result.tab,projectId:result.projectId,customerId:result.customerId,
      excludeId:result.excludeId,undo:result.needs,findPlan:result.findPlan,summary:'已添加手工筛选条件。'});
    return;
  }
  if(form.id==='caseForm'||form.dataset.form==='inline-case'){await saveCase(form,data,form.dataset.form==='inline-case',event.submitter?.value==='continue');return}

  if(form.id==='caseImportForm'){await saveCaseImport(form,data);return}
  if(form.id==='searchForm'){view.query=compact(data.query);resetPage(view.page);render();return}

    view.projectQuery=compact(data.query);view.projectStage=data.stage;resetPage('projects');render();return;
  }
  if(form.id==='projectPortraitForm'){
    const p=project(form.dataset.project);
    if(!p||!allowSales())return;
    p.portrait=String(data.portrait||'').trim();touchProject(p);close();persist();render();showToast('项目画像已保存');return;
  }
  if(form.id==='registerForm'){
    const draft=view.registerDraft;
    if(!allowSales())return;
    let entry=customer(data.customerId);
    if(draft.projectId&&project(draft.projectId)?.customerId&&!compatible(entry?.id||'new',draft.projectId)){
      showToast('请选用此项目关联的客户，或另开对话登记新客户');return;
    }
    if(!entry&&!compact(data.name)){showToast('请填写客户或公司名称');return}
    const needs=String(data.needs||'').split(/\n/).map(line=>line.trim()).filter(Boolean).map(line=>{
      const colon=line.search(/[:：]/);return colon<0?['补充需求',line]:[line.slice(0,colon).trim(),line.slice(colon+1).trim()];
    }).filter(([,value])=>value);
    if(!entry){entry={id:id(),number:nextCustomerNumber(),name:compact(data.name),createdBy:roles[view.role].name,createdAt:new Date().toISOString()};db.customers.unshift(entry)}
    Object.assign(entry,{channel:compact(data.channel),needs,source:draft.text});
    syncPrimaryContact(entry,compact(data.contact),entry.contactMethod||'');touchCustomer(entry);
    draft.customerId=entry.id;draft.needs=needs.map(([label,value])=>({label,value}));draft.saved=true;chat().customerId=entry.id;
    close();persist();render(true);showToast('客户和需求已登记');return;
  }
  if(form.dataset.form==='inline-follow'){
    if(!allowSales())return;
    if(!data.customerId){showToast('请选择客户');return}
    if(!compatible(data.customerId,data.projectId)){showToast('所选项目属于其他客户，请调整关联');return}
    if(!compact(data.summary)){showToast('请填写跟进结论');return}
    if(Boolean(data.due)!==Boolean(compact(data.next))){showToast('请同时填写下次跟进日期和事项');return}
    const task=db.follow.find(item=>item.id===form.dataset.task);
    if(task)task.done=true;
    const relatedLamp=project(data.projectId)?.items.find(item=>item.id===data.lampId);
    const line={id:id(),customerId:data.customerId,projectId:data.projectId,lampId:relatedLamp?.id||'',channel:data.channel,date:data.date,
      summary:compact(data.summary),contact:compact(data.contact),clock:data.clock,due:data.due,next:compact(data.next)};
    if(form.dataset.form==='inline-follow'){
      const message=chat().messages[Number(form.dataset.index)];
      if(!message||message.saved||message.dismissed)return;
      message.saved=line;
    }
    db.records.unshift(line);
    if(line.due)db.follow.push({id:id(),customerId:line.customerId,projectId:line.projectId,title:line.next,due:line.due,done:false});
    if(view.page==='work')chat().messages.push({kind:'text',tool:'客户跟进',text:'跟进已保存。'+(line.due?'已加入 '+timeOf(line.due)+' 的待跟进。':'')});
    close();persist();render(true);showToast('已保存跟进');return;
  }
  if(form.id==='rescheduleForm'){const task=db.follow.find(x=>x.id===form.dataset.id);if(task)task.due=data.due;close();persist();render();return}
  if(form.id==='contextForm'){
    if(!allowSales())return;
    const p=project(data.projectId);
    if(!compatible(data.customerId,data.projectId)){showToast('所选项目属于其他客户，请调整关联');return}
    chat().projectId=data.projectId||'';chat().customerId=p?.customerId||data.customerId||'';
    close();persist();render();return;
  }

  if(form.id==='addLampForm'){
    if(!allowSales())return;
    const lamp=findLamp(form.dataset.id),cid=form.dataset.customer||'';
    if(!lamp)return;
    const name=compact(data.name),space=compact(data.space)||'公共空间',qty=compact(data.quantity);
    if(qty&&(!Number.isInteger(Number(qty))||Number(qty)<1)){showToast('数量请填写正整数');return}
    const mode=form.dataset.mode||(form.dataset.single==='true'?'single':'existing');
    const single=mode==='single',create=single||mode==='new';
    const snapshot={...lamp,name:lampDisplayName(lamp),id:id(),lampId:lamp.id,space,qty,unit:compact(data.unit),designNote:compact(data.note),
      specs:readLampSpecs(data),thumbnail:imageForLamp(lamp),inquiryStatus:'未询价'};
    if(mode==='customer'){
      const entry=customer(data.customerId);
      if(!entry){showToast('请选择有效客户');return}
      if(db.customerLamps.some(item=>item.customerId===entry.id&&item.lampId===lamp.id&&item.space===space)){
        showToast('该灯具已关联到此客户');return;
      }
      db.customerLamps.push({...snapshot,customerId:entry.id});
      close();persist();render();showToast('已关联到客户 '+entry.name);return;
    }
    if(create&&!name){showToast('请填写项目名称');return}
    if(create&&data.customerId&&!customer(data.customerId)){showToast('请选择有效客户，或暂不关联');return}
    const p=create?nextProject(name,data.customerId||''):project(data.projectId);
    if(!p||(!create&&!compatible(cid,p.id))){showToast('请选择可用的项目');return}
    if(p.items.some(item=>!projectLampQuoted(item)&&(item.lampId||item.id)===lamp.id&&(item.space||'公共空间')===space)){
      showToast('该灯具在这个空间已有未询价记录，可到项目里修改数量');return;
    }
    p.items.push(snapshot);touchProject(p);
    if(create)db.projects.unshift(p);
    if(!single&&isFindPage()){chat().lastProjectId=p.id;view.findSideTab='project'}
    else if(!single&&!chat().projectId&&compatible(chat().customerId,p.id)){chat().projectId=p.id;chat().customerId=p.customerId||chat().customerId}
    chat().messages.push({kind:'joined-lamp',tool:'灯具选型',text:'已将「'+lampDisplayName(lamp)+'」加入 '+p.name+' · '+space+'。',projectId:p.id,lampId:snapshot.id});
    close();persist();
    if(single)showProjectQuote(p,[snapshot.id]);else render(true);
    return;
  }

  if(form.id==='customerLampEditForm'){
    const item=db.customerLamps.find(line=>line.id===form.dataset.line);
    if(!allowSales()||!item)return;
    Object.assign(item,{space:compact(data.space)||'公共空间',qty:compact(data.quantity),unit:compact(data.unit),designNote:compact(data.note),specs:readLampSpecs(data)});
    const c=customer(item.customerId);if(c)touchCustomer(c);
    close();persist();render();showToast('已保存灯具');return;
  }
  if(form.id==='editLampForm'){
    if(!allowSales())return;
    const p=project(form.dataset.project),line=p?.items.find(item=>item.id===form.dataset.line);
    if(!line)return;
    const qty=compact(data.quantity);
    if(qty&&(!Number.isInteger(Number(qty))||Number(qty)<1)){showToast('数量请填写正整数');return}
    Object.assign(line,{qty,unit:compact(data.unit),space:compact(data.space)||'公共空间',designNote:compact(data.note),specs:readLampSpecs(data)});
    touchProject(p);close();persist();render();return;
  }

  if(form.id==='editCustomerNeedsForm'){
    const c=customer(form.dataset.customer);if(!c||!allowSales())return;
    c.needText=compact(data.needs);c.needs=findNeeds(c.needText,[]);touchCustomer(c);closeCrmDialog();persist();render();return;
  }
  if(form.id==='copyProjectForm'){
    const source=project(form.dataset.project),name=compact(data.name);
    if(!allowSales()||!source||!name)return;
    const p=nextProject(name,source.customerId);
    for(const key of ['owner','location','quoteLanguage','currency','participants','note'])p[key]=source[key];
    p.items=source.items.map(item=>({
      id:id(),lampId:item.lampId||item.id,name:lampDisplayName(item),space:item.space,qty:item.qty,unit:item.unit,
      designNote:item.designNote,specs:readLampSpecs(item.specs),facts:{...item.facts},thumbnail:imageForLamp(item),
      source:item.source,website:item.website,url:item.url,project:item.project,referencePrice:item.referencePrice,
      inquiryStatus:'未询价'
    }));
    db.projects.unshift(p);close();persist();
    showToast('已生成新项目【'+name+'】请返回列表查看');return;
  }
  if(form.id==='projectNeedFindForm'){
    const p=project(form.dataset.project);
    if(!allowSales()||!p)return;
    if(data.source==='new'){newFindSession(p.customerId,p.id);focusComposer();return}
    const line=data.lampId&&p.items.find(item=>item.id===data.lampId);
    if(data.lampId&&!line)return;
    const needs=projectSearchNeeds(p,line),session=newFindSession(p.customerId,p.id);

    const plan=makeFindPlan(needs);
    view.compose=plan.recognition;session.searchText=plan.recognition;
    session.messages.push({kind:'user',text:plan.recognition});
    addLampMessage(session,plan.active,{projectId:p.id,customerId:p.customerId,findPlan:plan});
    return;
  }
  if(form.id==='newProjectForm'){
    if(!allowSales())return;
    const name=compact(data.name),owner=compact(data.owner);
    if(!name||!owner||!projectStages.includes(data.stage)){showToast('请填写项目名称、负责人和阶段');return}
    if(data.customerId&&!customer(data.customerId)){showToast('请选择有效客户');return}

      quoteLanguage:compact(data.quoteLanguage),currency:compact(data.currency),participants:compact(data.participants),note:String(data.note||'').trim()});

      for(const record of [...db.records,...db.follow])if(record.projectId===p.id)record.customerId=p.customerId;
    }
    touchProject(p);view.project=p.id;view.projectDetail=true;view.projectDetailTab='lamps';
    close();persist();showPage('projects');showToast(existing?'项目已更新':'项目已新建');
  }

  else if(form.id==='crmProjectLinkForm'){
    const c=customer(form.dataset.customer),p=project(data.projectId);
    if(!allowSales()||!c||!p||p.customerId){crmFormError(form,'请选择尚未关联客户的项目');return}
    p.customerId=c.id;
    for(const item of [...db.records,...db.follow])if(item.projectId===p.id)item.customerId=c.id;
    touchProject(p);touchCustomer(c);closeCrmDialog();persist();render();showToast('已关联项目 '+p.name);
  }
  else if(form.id==='crmFollowForm')void saveCrmFollow(form,data);
  else if(form.id==='crmImportFollowForm')void reviewCrmImportedFollow(form,data);
});
